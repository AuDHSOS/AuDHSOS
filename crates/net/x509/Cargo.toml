[package]
name = "audhsos-x509"
description = "Certificate parsing, signature verification, path validation, and name matching"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
test-certificates = ["crypto-ec/test-signing"]

[dependencies]
audhsos-der.workspace = true
crypto-ec.workspace = true
crypto-hash.workspace = true

[dev-dependencies]
# The builder signs, and signing lives behind a feature of `crypto-ec`.
# Enabling it here makes it available to this crate's own tests without
# putting it into any product build.
crypto-ec = { workspace = true, features = ["test-signing"] }
test-support.workspace = true

[lints]
workspace = true
