[package]
name = "kernel-hal-x86_64"
description = "The x86_64 adapter of the kernel: privileged instructions, descriptor tables, traps, interrupt controllers, timer, boot information, console, and exit device"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["debug-uart", "test-exit"]
debug-uart = []
test-exit = []

[dependencies]
audhsos-abi.workspace = true
audhsos-sync.workspace = true
kernel-acpi.workspace = true
driver-uart16550.workspace = true
kernel-hal-api = { workspace = true, features = ["port-io"] }
kernel-mm.workspace = true
kernel-test-harness.workspace = true
kernel-types.workspace = true
kernel-x86-tables.workspace = true

[lints]
workspace = true
