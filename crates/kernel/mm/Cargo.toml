[package]
name = "kernel-mm"
description = "Memory map normalization, frame allocation, page tables, and address space regions of the AuDHSOS kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
test-strategies = ["dep:test-support"]

[dependencies]
audhsos-abi.workspace = true
kernel-hal-api.workspace = true
kernel-types.workspace = true
