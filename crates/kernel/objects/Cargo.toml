[package]
name = "kernel-objects"
description = "The kernel objects of AuDHSOS: generation-checked pools, the handle arena, quotas, processes, threads, and memory objects"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
test-strategies = ["dep:test-support", "kernel-mm/test-strategies", "kernel-types/test-strategies"]

[dependencies]
audhsos-abi.workspace = true
kernel-mm.workspace = true
kernel-types.workspace = true
test-support = { workspace = true, optional = true }

[dev-dependencies]
kernel-mm = { workspace = true, features = ["test-strategies"] }
kernel-types = { workspace = true, features = ["test-strategies"] }
test-support.workspace = true

[lints]
workspace = true
