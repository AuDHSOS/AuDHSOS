name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - name: Run every check
        run: cargo xtask check
