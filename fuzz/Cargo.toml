# The fuzz targets are a workspace of their own: they are built with the
# sanitizer and with `--cfg fuzzing`, which the checks of the main
# workspace do not use. `cargo xtask fuzz` builds them from here.

[workspace]
resolver = "3"
members = ["boot_image_header", "boot_info", "elf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Manuel Baesler and contributors"]
rust-version = "1.100"

[workspace.dependencies]
audhsos-abi = { path = "../crates/abi" }
audhsos-elf = { path = "../crates/elf" }
fuzz-support = { path = "../crates/support/fuzz" }

[workspace.lints.rust]
# `--cfg fuzzing` is set by `cargo xtask fuzz`, not by a Cargo feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[profile.release]
debug = true
