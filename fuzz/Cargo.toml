# The fuzz targets are a workspace of their own: they are built with the
# sanitizer and with `--cfg fuzzing`, which the checks of the main
# workspace do not use. `cargo xtask fuzz` builds them from here.

[workspace]
resolver = "3"
members = [
    "timer_queue",
    "event_target",
    "boot_image_header",
    "boot_info",
    "der",
    "dns_message",
    "elf",
    "http_response",
    "ipv4",
    "ipv6",
    "jrs_source",
    "json_codec",
    "math_pow",
    "utf16_search",
    "regex_nfa",
    "regex_bt",
    "madt",
    "mcfg",
    "pci_config",
    "mouse_packet",
    "pem",
    "rsa",
    "scancode",
    "tar",
    "tcp_segment",
    "tls_handshake",
    "tls_record",
    "x509",
    "sqlite_image",
    "sqlite_tokens",
    "sqlite_expr",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Manuel Baesler and contributors"]
rust-version = "1.100"

[workspace.dependencies]
audhsos-timer-queue = { path = "../crates/timer-queue" }
audhsos-utf16 = { path = "../crates/utf16" }
audhsos-math = { path = "../crates/math" }
audhsos-json = { path = "../crates/json" }
audhsos-event-target = { path = "../crates/event-target" }
audhsos-abi = { path = "../crates/abi" }
audhsos-der = { path = "../crates/net/der" }
audhsos-encoding = { path = "../crates/encoding" }
audhsos-elf = { path = "../crates/elf" }
audhsos-time = { path = "../crates/time" }
crypto-rng = { path = "../crates/crypto/rng", features = ["test-doubles"] }
driver-i8042 = { path = "../crates/drivers/i8042" }
audhsos-tls = { path = "../crates/net/tls" }
audhsos-x509 = { path = "../crates/net/x509" }
crypto-rsa = { path = "../crates/crypto/rsa" }
kernel-acpi = { path = "../crates/kernel/acpi" }
pci = { path = "../crates/pci", features = ["test-doubles"] }
net-dns = { path = "../crates/net/dns" }
net-http = { path = "../crates/net/http" }
net-ip = { path = "../crates/net/ip" }
net-ipv6 = { path = "../crates/net/ipv6" }
net-tcp = { path = "../crates/net/tcp" }
net-wire = { path = "../crates/net/wire" }
fuzz-support = { path = "../crates/support/fuzz" }
user-loader = { path = "../crates/user/loader" }
jrs = { path = "../crates/jrs" }
audhsos-regex = { path = "../crates/regex" }
audhsos-regex-bt = { path = "../crates/regex-bt" }
db-sqlite = { path = "../crates/db/sqlite" }

[workspace.lints.rust]
# `--cfg fuzzing` is set by `cargo xtask fuzz`, not by a Cargo feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[profile.release]
debug = true

# Which packages carry the coverage instrumentation the engine steers by.
#
# `*` is every dependency of this workspace, which is every crate under
# test; the members below are the fuzz targets themselves, whose own
# branches are worth steering by as well. `fuzz-support` is the engine and
# is left out on purpose: its counters would be cleared and read for every
# input and would never say anything about the input, and on a target of
# this project it is the greater part of them. Leaving it out is worth
# about three runs in four.
#
# This is a release-profile setting, so a release build of this workspace
# is instrumented whether or not `--cfg fuzzing` was set. Only the flag
# decides what `main` does; the instrumentation decides how fast it is.
[profile.release.package."*"]
rustflags = [
    "-Cpasses=sancov-module",
    "-Cllvm-args=-sanitizer-coverage-level=4",
    "-Cllvm-args=-sanitizer-coverage-inline-8bit-counters",
    "-Cllvm-args=-sanitizer-coverage-pc-table",
    "-Cllvm-args=-sanitizer-coverage-trace-compares",
]

[profile.release.package.fuzz-support]
rustflags = []

[profile.release.package.event_target]
rustflags = [
    "-Cpasses=sancov-module",
    "-Cllvm-args=-sanitizer-coverage-level=4",
    "-Cllvm-args=-sanitizer-coverage-inline-8bit-counters",
    "-Cllvm-args=-sanitizer-coverage-pc-table",
    "-Cllvm-args=-sanitizer-coverage-trace-compares",
]

