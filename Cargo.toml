[workspace]
resolver = "3"
members = [
    "crates/abi",
    "crates/time",
    "crates/encoding",
    "crates/deflate",
    "crates/collections",
    "crates/crypto/ct",
    "crates/crypto/hash",
    "crates/crypto/aead",
    "crates/crypto/bignum",
    "crates/crypto/ec",
    "crates/crypto/rng",
    "crates/crypto/rsa",
    "crates/net/der",
    "crates/net/x509",
    "crates/net/tls",
    "crates/net/wire",
    "crates/net/eth",
    "crates/net/ip",
    "crates/net/ipv6",
    "crates/net/udp",
    "crates/net/tcp",
    "crates/net/dns",
    "crates/net/dhcp",
    "crates/net/http",
    "crates/net/stack",
    "crates/boot/uefi-x86_64",
    "crates/elf",
    "crates/gfx",
    "crates/symbols",
    "crates/uefi",
    "crates/sync",
    "crates/drivers/uart16550",
    "crates/virtio/queue",
    "crates/user/loader",
    "crates/user/programs",
    "crates/user/servers/console",
    "crates/user/servers/memory",
    "crates/user/servers/name",
    "crates/user/proto",
    "crates/user/rt",
    "crates/user/sys-x86_64",
    "crates/user/test-programs",
    "crates/kernel/types",
    "crates/kernel/acpi",
    "crates/kernel/hal-api",
    "crates/kernel/objects",
    "crates/kernel/sched",
    "crates/kernel/ipc",
    "crates/kernel/syscall",
    "crates/kernel/bin",
    "crates/kernel/core",
    "crates/kernel/hal-x86_64",
    "crates/kernel/test-harness",
    "crates/kernel/x86-tables",
    "crates/kernel/mm",
    "crates/support/fuzz",
    "crates/support/testing",
    "crates/tools/markdown",
    "crates/tools/html",
    "crates/tools/svg",
    "crates/tools/pdf",
    "crates/tools/docpdf",
    "crates/tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Manuel Baesler and contributors"]
rust-version = "1.100"

exclude = ["fuzz"]

[workspace.dependencies]
audhsos-abi = { path = "crates/abi" }
audhsos-time = { path = "crates/time" }
audhsos-encoding = { path = "crates/encoding" }
audhsos-deflate = { path = "crates/deflate" }
audhsos-collections = { path = "crates/collections" }
crypto-ct = { path = "crates/crypto/ct" }
crypto-hash = { path = "crates/crypto/hash" }
crypto-aead = { path = "crates/crypto/aead" }
crypto-bignum = { path = "crates/crypto/bignum" }
crypto-ec = { path = "crates/crypto/ec" }
crypto-rng = { path = "crates/crypto/rng" }
crypto-rsa = { path = "crates/crypto/rsa" }
audhsos-der = { path = "crates/net/der" }
audhsos-x509 = { path = "crates/net/x509" }
audhsos-tls = { path = "crates/net/tls" }
net-wire = { path = "crates/net/wire" }
net-eth = { path = "crates/net/eth" }
net-ip = { path = "crates/net/ip" }
net-ipv6 = { path = "crates/net/ipv6" }
net-udp = { path = "crates/net/udp" }
net-tcp = { path = "crates/net/tcp" }
net-dns = { path = "crates/net/dns" }
net-dhcp = { path = "crates/net/dhcp" }
net-http = { path = "crates/net/http" }
net-stack = { path = "crates/net/stack" }
boot-uefi-x86_64 = { path = "crates/boot/uefi-x86_64" }
audhsos-elf = { path = "crates/elf" }
gfx = { path = "crates/gfx" }
audhsos-symbols = { path = "crates/symbols" }
audhsos-uefi = { path = "crates/uefi" }
audhsos-sync = { path = "crates/sync" }
driver-uart16550 = { path = "crates/drivers/uart16550" }
virtio-queue = { path = "crates/virtio/queue" }
server-console = { path = "crates/user/servers/console" }
user-programs = { path = "crates/user/programs" }
server-memory = { path = "crates/user/servers/memory" }
server-name = { path = "crates/user/servers/name" }
user-loader = { path = "crates/user/loader" }
user-proto = { path = "crates/user/proto" }
user-rt = { path = "crates/user/rt" }
user-sys-x86_64 = { path = "crates/user/sys-x86_64" }
user-test-programs = { path = "crates/user/test-programs" }
kernel-types = { path = "crates/kernel/types" }
kernel-acpi = { path = "crates/kernel/acpi" }
kernel-hal-api = { path = "crates/kernel/hal-api" }
kernel-objects = { path = "crates/kernel/objects" }
kernel-sched = { path = "crates/kernel/sched" }
kernel-ipc = { path = "crates/kernel/ipc" }
kernel-syscall = { path = "crates/kernel/syscall" }
audhsos-kernel = { path = "crates/kernel/bin" }
kernel-core = { path = "crates/kernel/core" }
kernel-hal-x86_64 = { path = "crates/kernel/hal-x86_64" }
kernel-test-harness = { path = "crates/kernel/test-harness" }
kernel-x86-tables = { path = "crates/kernel/x86-tables" }
kernel-mm = { path = "crates/kernel/mm" }
fuzz-support = { path = "crates/support/fuzz" }
test-support = { path = "crates/support/testing" }
doc-markdown = { path = "crates/tools/markdown" }
doc-html = { path = "crates/tools/html" }
doc-svg = { path = "crates/tools/svg" }
doc-pdf = { path = "crates/tools/pdf" }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unused_crate_dependencies = "deny"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Individually enabled nursery lints.
missing_const_for_fn = "warn"
redundant_clone = "warn"
needless_pass_by_ref_mut = "warn"
# Allowed: the workspace is not published, and `assert_eq!(x, [] as [T; 0])` is no clearer than `assert!(x.is_empty())`.
cargo_common_metadata = "allow"
assert_is_empty = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
