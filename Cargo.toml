[workspace]
resolver = "3"
members = [
    "crates/abi",
    "crates/crypto/ct",
    "crates/crypto/hash",
    "crates/crypto/aead",
    "crates/crypto/ec",
    "crates/crypto/rng",
    "crates/net/der",
    "crates/net/x509",
    "crates/net/tls",
    "crates/boot/uefi-x86_64",
    "crates/elf",
    "crates/uefi",
    "crates/sync",
    "crates/drivers/uart16550",
    "crates/kernel/types",
    "crates/kernel/hal-api",
    "crates/kernel/objects",
    "crates/kernel/bin",
    "crates/kernel/core",
    "crates/kernel/hal-x86_64",
    "crates/kernel/test-harness",
    "crates/kernel/x86-tables",
    "crates/kernel/mm",
    "crates/support/fuzz",
    "crates/support/testing",
    "crates/tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Manuel Baesler and contributors"]
rust-version = "1.100"

exclude = ["fuzz"]

[workspace.dependencies]
audhsos-abi = { path = "crates/abi" }
crypto-ct = { path = "crates/crypto/ct" }
crypto-hash = { path = "crates/crypto/hash" }
crypto-aead = { path = "crates/crypto/aead" }
crypto-ec = { path = "crates/crypto/ec" }
crypto-rng = { path = "crates/crypto/rng" }
audhsos-der = { path = "crates/net/der" }
audhsos-x509 = { path = "crates/net/x509" }
audhsos-tls = { path = "crates/net/tls" }
boot-uefi-x86_64 = { path = "crates/boot/uefi-x86_64" }
audhsos-elf = { path = "crates/elf" }
audhsos-uefi = { path = "crates/uefi" }
audhsos-sync = { path = "crates/sync" }
driver-uart16550 = { path = "crates/drivers/uart16550" }
kernel-types = { path = "crates/kernel/types" }
kernel-hal-api = { path = "crates/kernel/hal-api" }
kernel-objects = { path = "crates/kernel/objects" }
audhsos-kernel = { path = "crates/kernel/bin" }
kernel-core = { path = "crates/kernel/core" }
kernel-hal-x86_64 = { path = "crates/kernel/hal-x86_64" }
kernel-test-harness = { path = "crates/kernel/test-harness" }
kernel-x86-tables = { path = "crates/kernel/x86-tables" }
kernel-mm = { path = "crates/kernel/mm" }
fuzz-support = { path = "crates/support/fuzz" }
test-support = { path = "crates/support/testing" }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unused_crate_dependencies = "deny"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Individually enabled nursery lints.
missing_const_for_fn = "warn"
redundant_clone = "warn"
needless_pass_by_ref_mut = "warn"
# Allowed: the workspace is not published, and `assert_eq!(x, [] as [T; 0])` is no clearer than `assert!(x.is_empty())`.
cargo_common_metadata = "allow"
assert_is_empty = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
